<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>網站製作 作例集</title>
<meta name="description" content="網站製作的範例網站一覽">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&amp;family=Noto+Sans+TC:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2;color:#22302A;font-family:'Noto Sans TC','Noto Sans CJK TC',sans-serif}
a{color:#7A6236}a:hover{color:#5C4A28}
.card{display:flex;flex-wrap:wrap;background:#FFFFFF;border:1px solid #DEDCD3;text-decoration:none;color:inherit;transition:border-color .2s}
.card:hover{border-color:#A3874F}
.card:focus-visible{outline:2px solid #7A6236;outline-offset:4px}
</style>
</head>
<body>
<main style="max-width: 1080px; margin: 0 auto; padding: clamp(56px, 8vw, 104px) clamp(20px, 5vw, 48px) 72px">

<header style="margin-bottom: clamp(40px, 6vw, 64px)">
<p style="margin: 0 0 14px; font-size: 12px; letter-spacing: 0.36em; color: #7A6236">WEB DESIGN SAMPLES</p>
<h1 style="margin: 0; font-family: 'Noto Serif TC', 'Noto Serif CJK TC', serif; font-weight: 400; font-size: clamp(32px, 4.4vw, 44px); letter-spacing: 0.16em">網站製作 作例集</h1>
<p style="margin: 24px 0 0; font-size: 16px; line-height: 2; color: #4A5650; max-width: 36em"><span style="display: inline-block">以下是網站製作的範例。</span><span style="display: inline-block">點選即可實際瀏覽，</span><span style="display: inline-block">電腦與手機都會自動調整成合適的版面。</span></p>
</header>

<section aria-label="範例網站">
<a class="card" href="seiran/">
<div style="flex: 3 1 420px; min-width: 0; background: #1D2924; display: flex">
<img src="assets/seiran-pc.jpg" alt="晴嵐茶寮範例網站的首頁畫面" width="1440" height="790" style="display: block; width: 100%; height: auto; align-self: center">
</div>
<div style="flex: 2 1 300px; min-width: 0; padding: clamp(28px, 4vw, 44px); display: flex; flex-direction: column; justify-content: center">
<p style="margin: 0 0 12px; font-size: 12px; letter-spacing: 0.24em; color: #7A6236">店鋪網站 ・ 茶館</p>
<h2 style="margin: 0; font-family: 'Noto Serif TC', 'Noto Serif CJK TC', serif; font-weight: 400; font-size: 28px; letter-spacing: 0.16em">晴嵐茶寮</h2>
<p style="margin: 18px 0 0; font-size: 15px; line-height: 2; color: #4A5650"><span style="display: inline-block">以台灣茶與日式待客為主題，</span><span style="display: inline-block">沉穩、有質感的一頁式店鋪網站。</span></p>
<ul style="margin: 20px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px">
<li style="font-size: 12px; letter-spacing: 0.08em; padding: 4px 12px; background: #F1F0EB; color: #4A5650">電腦／手機自動切換</li>
<li style="font-size: 12px; letter-spacing: 0.08em; padding: 4px 12px; background: #F1F0EB; color: #4A5650">一頁式</li>
<li style="font-size: 12px; letter-spacing: 0.08em; padding: 4px 12px; background: #F1F0EB; color: #4A5650">虛構店家</li>
</ul>
<p style="margin: 28px 0 0; font-size: 15px; letter-spacing: 0.14em; color: #7A6236">瀏覽網站 →</p>
</div>
</a>
</section>

<section style="margin-top: clamp(56px, 8vw, 88px); border-top: 1px solid #DEDCD3; padding-top: 40px; display: flex; flex-wrap: wrap; gap: 32px 64px">
<div style="flex: 1 1 280px; min-width: 0">
<h2 style="margin: 0 0 14px; font-family: 'Noto Serif TC', 'Noto Serif CJK TC', serif; font-weight: 400; font-size: 20px; letter-spacing: 0.16em">可承接的網站</h2>
<p style="margin: 0; font-size: 15px; line-height: 2; color: #4A5650">企業官網、店鋪網站，也可製作日文版頁面。</p>
</div>
<div style="flex: 1 1 280px; min-width: 0">
<h2 style="margin: 0 0 14px; font-family: 'Noto Serif TC', 'Noto Serif CJK TC', serif; font-weight: 400; font-size: 20px; letter-spacing: 0.16em">洽詢方式</h2>
<p style="margin: 0; font-size: 15px; line-height: 2; color: #4A5650">製作流程與費用，請參考介紹資料，或直接聯絡介紹人。</p>
</div>
</section>

<footer style="margin-top: 72px; font-size: 12px; color: #6B746F">※ 作例中的店名、地址及內容皆為虛構。</footer>
</main>
</body>
</html>
